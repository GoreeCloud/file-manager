    - glaze-ui==1.6.0
    - android-api>=26
  provides: []

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - ARCHITECTURE.md
    - CONFORMANCE.md
    - SPECIFICATIONS.md
    - app/src/main/AndroidManifest.xml
    - core/src/main/kotlin/com/goreecloud/filemanager/model/FileModels.kt
    - core/src/main/kotlin/com/goreecloud/filemanager/platform/PlatformAuthorities.kt
    - core/src/main/kotlin/com/goreecloud/filemanager/storage/FileStorageProvider.kt
    - core/src/main/kotlin/com/goreecloud/filemanager/storage/FileTransferService.kt
    - app/src/main/java/com/goreecloud/filemanager/storage/LocalFileRepository.kt
    - app/src/main/java/com/goreecloud/filemanager/storage/SafTreeFileRepository.kt
    - app/src/main/java/com/goreecloud/filemanager/ui/FileManagerApp.kt
    - app/src/main/java/com/goreecloud/filemanager/ui/GlazeFoundation.kt
    - linux-client/src/main/kotlin/com/goreecloud/filemanager/linux/LinuxFileRepository.kt
    - linux-client/src/main/kotlin/com/goreecloud/filemanager/linux/LinuxDesktopController.kt
    - linux-desktop/src/main/kotlin/com/goreecloud/filemanager/linux/LinuxDesktopDevelopmentMain.kt
  blockers:
    - Linux is a required first-class File Manager target. Shared core, a bounded Linux filesystem provider/build-test foundation, read-only location discovery, and an unmerged native desktop Development surface now exist, but supported packaging, representative runtime/accessibility/input evidence, desktop-system integration, applicable platform-system acceptance, signing/release/rollback provenance, and explicit Linux lifecycle qualification are not established; supported_platforms therefore remains Android-only.
    - GoreeCloud Manager registration, administrative visibility, lifecycle integration, and acceptance are not established.
    - Privacy Shield producer integration and accepted privacy authorization/minimization/retention behavior are not established.
    - Wardveil Security producer integration and accepted file-security/destructive-operation policy are not established; SHA-256 transfer verification is integrity evidence only.
    - Everkeep integration, unified Trash/recovery, backup/recoverability evidence, clean-target restore, rollback, and continuity acceptance are not established.
    - File Manager now has a bounded GLAZE UI V1.6 / 1.6.0 source-policy mapping, but complete Android/Linux optical and component migration plus rendered, accessibility, representative-platform, performance, rollback, release, and production acceptance remain incomplete.
    - GoreeCloud Mesh registration, capabilities/events, producer evidence, and runtime acceptance are not established.
    - GoreeCloud Identity production account/session/device/ownership integration and acceptance are not established.
    - GoreeCloud Policy runtime evaluation, enforcement coordination, explanation, freshness, exception handling, and evidence acceptance are not established.
    - GoreeCloud Observability runtime health, diagnostics, performance, dependency-health, provenance/freshness, collection-gap, privacy-safe telemetry, and target-environment acceptance are not established.
    - GoreeCloud Sync remains separately governed; provider registration, authenticated synchronization, reconciliation, deletion/conflict behavior, offline state, and cross-device acceptance are not established.
    - Complete user-facing copy/move/duplicate/file creation, multi-selection, unified Trash, removable/network/Drive providers, previews, sharing, search/indexing, production signing, representative-platform acceptance, release approval, Release Candidate entry, and Stable qualification remain outstanding.
