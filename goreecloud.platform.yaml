  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - core/src/main/kotlin/com/goreecloud/filemanager/platform/PlatformAuthorities.kt
    notes: File Manager has explicit platform-authority adapter boundaries, but accepted GoreeCloud Manager registration, administrative visibility, lifecycle control, and runtime acceptance are not established.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - ARCHITECTURE.md
      - CONFORMANCE.md
      - core/src/main/kotlin/com/goreecloud/filemanager/platform/PlatformAuthorities.kt
      - app/src/main/java/com/goreecloud/filemanager/storage/SafTreeFileRepository.kt
    notes: Current Android storage access is user-authorized through the Storage Access Framework and avoids unrestricted filesystem permission, and missing privacy evidence remains explicit rather than reassuring. Accepted Privacy Shield policy, privacy-state producer integration, minimization/retention authority, and runtime acceptance are not established. The Linux Development filesystem/provider surface likewise does not substitute for Privacy Shield authority.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - ARCHITECTURE.md
      - CONFORMANCE.md
      - core/src/main/kotlin/com/goreecloud/filemanager/platform/PlatformAuthorities.kt
      - core/src/main/kotlin/com/goreecloud/filemanager/storage/FileTransferService.kt
    notes: File Manager separates security evidence from ordinary file state and cross-provider transfer integrity uses SHA-256 verification, but authoritative Wardveil Security producer integration, applicable content scanning/protection, destructive-operation security policy, and runtime acceptance are not established.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - ARCHITECTURE.md
      - CONFORMANCE.md
      - core/src/main/kotlin/com/goreecloud/filemanager/platform/PlatformAuthorities.kt
    notes: The domain model keeps synchronization, backup/recoverability, and continuity distinct and recursive folder deletion remains refused while recovery safeguards are incomplete. Accepted Everkeep backup/recovery evidence, Trash/recovery integration, clean-target restore, continuity, and portability acceptance are not established.
  glaze_ui:
    result: applicable-migration-required
    version: "1.6.0"
    evidence:
      - README.md
      - ARCHITECTURE.md
      - CONFORMANCE.md
      - app/src/main/java/com/goreecloud/filemanager/ui/GlazeFoundation.kt
      - app/src/main/java/com/goreecloud/filemanager/ui/GlazeV16PresentationPolicy.kt
      - app/src/main/java/com/goreecloud/filemanager/ui/FileManagerApp.kt
      - linux-desktop/src/main/kotlin/com/goreecloud/filemanager/linux/LinuxDesktopDevelopmentMain.kt
    notes: Current Official Stable authority is GLAZE UI V1.6 / 1.6.0 at exact release source a7180679ea851389e0f3004515f9a25f420e716d. This Development candidate corrects the stale/future Android source target and adds a bounded V1.6 presentation-policy mapping, but existing Android and Linux presentation remains migration-required until complete optical/component migration plus rendered, accessibility, adaptive/form-factor, representative-platform, performance, rollback, Human Visual Excellence, release, and production acceptance are established independently for each platform.
  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - ARCHITECTURE.md
      - core/src/main/kotlin/com/goreecloud/filemanager/platform/PlatformAuthorities.kt
    notes: GoreeCloud Mesh coordination is represented only by an application adapter boundary. Canonical registration, capability publication, producer evidence, event contracts, and runtime acceptance are not established.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - ARCHITECTURE.md
      - core/src/main/kotlin/com/goreecloud/filemanager/platform/PlatformAuthorities.kt
    notes: Provider-scoped file identity and Android URI authorization exist, but production GoreeCloud Identity account/session/device identity, ownership/access producer integration, and acceptance are not established. Linux platform Identity and access integration are also not yet implemented.

  policy:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - CONFORMANCE.md
      - goreecloud.platform.yaml
    notes: GoreeCloud Policy is applicable to destructive-operation rules, provider capability restrictions, privacy/security decisions, administrative controls, and evidence handling, but accepted runtime Policy evaluation, distribution, explanation, freshness, enforcement coordination, exception handling, and production acceptance are not established.
  observability:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - CONFORMANCE.md
      - goreecloud.platform.yaml
    notes: File Manager has source/build validation and user-visible operation outcomes, but accepted GoreeCloud Observability health, diagnostics, transfer/performance signals, provider/dependency health, provenance/freshness, privacy-safe telemetry, target-environment monitoring, alerting, and representative-runtime acceptance are not established.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Define the approved File Manager-owned durable-state backup scope separately from files owned by external providers and from backups owned by GoreeCloud Backup or Everkeep.
      - Preserve the rule that synchronized copies and provider duplicates do not become recovery evidence without authoritative backup/recoverability state.
      - Exclude transient SAF operation state, temporary transfer buffers, credentials, provider secrets, and unrelated platform state from ordinary backup scope.
  restore:
    required: true
    requirements:
      - Establish accepted restoration of File Manager-owned preferences, authorized-provider configuration where safely reconstructible, and other approved application state without fabricating Android URI grants or future Linux filesystem authority on a clean target.
      - Define unified Trash/recovery and destructive-operation rollback behavior before recursive deletion or broad destructive workflows are enabled.
      - Revalidate applicable Privacy Shield, Wardveil Security, Identity, and provider authorization after restore rather than treating historical state as current authority.
  export:
    required: true
    requirements:
      - Export only File Manager-owned portable configuration and metadata that the application is authorized to disclose; provider-owned file bytes remain governed by the source provider and user action.
      - Preserve explicit provider identity and capability boundaries so export does not imply broader storage authority.
      - Keep credentials, URI grants, security tokens, private platform evidence, and unrelated provider state out of portable output unless separately approved.
  portability:
    required: true
    requirements:
      - Preserve provider-scoped resource identity, integrity metadata, operation provenance, and applicable user preferences where portable.
      - Treat Android persisted URI permissions and future Linux platform-specific resource authority as platform/device-specific authorization that must be re-established rather than copied as portable credentials.
      - Define cross-device/provider conflict, unavailable-provider, duplicate, move/copy, Trash, and recovery behavior before product-wide portability is claimed.

external_dependencies:
  - name: Android platform
    purpose: Current supported application runtime, Storage Access Framework document-tree authorization, persisted URI permissions, DocumentsProvider interoperability, accessibility, and system file-selection UI.
    required: true
    version_constraint: ">=26"

